services:
  movie:
    build: .
    restart: always
    # Tum ayarlar .env'den gelir. Ozellikle TMDB_TOKEN sart: IMDB -> icerik
    # eslemesi ona dayaniyor, yoksa addon hicbir stream dondurmez.
    env_file:
      - .env
    # Olculen dublaj gecikmeleri yeniden uretilemeyen tek veri: hiz orani
    # kaynagin fps'inden hesaplanabiliyor ama bastaki kirpma yalnizca
    # olculebiliyor. Uygulama dizini her derlemede sifirlandigi icin depo
    # konteyner disinda tutuluyor.
    environment:
      - DUBSYNC_STORE=/data/dubsync-store.json
    volumes:
      - ./data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.movie.rule=Host(`movie.hasankoman.dev`)
      - traefik.http.routers.movie.tls=true
      - traefik.http.routers.movie.entrypoints=web,websecure
      - traefik.http.routers.movie.tls.certresolver=mytlschallenge
      - traefik.http.services.movie.loadbalancer.server.port=7000
    networks:
      - n8n_default

networks:
  n8n_default:
    external: true
